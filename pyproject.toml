[project]
name = "timalens-lab"
version = "0.1.0"
description = "Upload any lesson, get an interactive electric-circuits lab: Meta Muse Spark designs it, a deterministic engine runs the physics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TimaLens Ltd" }]
keywords = ["education", "physics", "electric-circuits", "simulation", "meta-ai", "llm", "edtech"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Topic :: Education",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "openai>=1.40",
  "pypdf>=4.2",
  "pillow>=10",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "fpdf2>=2.7", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "SIM"]
# B008: FastAPI's File()/Form() defaults are the framework's idiom
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# the sample-lesson builder lays out a PDF one compact line per block
"tools/make_sample_lesson.py" = ["E702"]
