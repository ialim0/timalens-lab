<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimaLens Lab</title>
<link rel="icon" href="img/timalens-icon.png">
<meta name="description" content="Upload an electricity lesson, get an interactive 2D/3D lab · Téléverse un cours d'électricité, obtiens un laboratoire interactif 2D/3D.">
<link rel="stylesheet" href="css/lab.css">
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  .hero { padding: 28px 0 8px; }
  .hero h1 { font-size: clamp(26px, 5vw, 40px); line-height: 1.15; margin: 0 0 10px; letter-spacing: -0.01em; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin: 0; color: var(--muted); max-width: 640px; font-size: 16px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; margin-top: 20px; }
  @media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  .box h2 { margin: 0 0 12px; font-size: 18px; }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 10px; padding: 22px 14px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .drop b { display: block; font-size: 16px; margin-bottom: 4px; }
  .drop .file { margin-top: 8px; font-weight: 600; color: var(--accent); word-break: break-all; }
  .or { text-align: center; color: var(--muted); font-size: 13px; margin: 10px 0; }
  textarea.lesson { width: 100%; min-height: 120px; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); resize: vertical; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .fields label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .fields .wide { grid-column: 1 / -1; }
  .fields select, .fields input { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .go { width: 100%; padding: 12px; font-size: 16px; }
  .stages { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; }
  .stages li { display: flex; gap: 10px; align-items: center; color: var(--muted); }
  .stages li::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
  .stages li.now { color: var(--ink); font-weight: 600; }
  .stages li.now::before { border-color: var(--accent); border-top-color: transparent; animation: spin .9s linear infinite; }
  .stages li.done { color: var(--ink); }
  .stages li.done::before { background: var(--ok); border-color: var(--ok); }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .stages li.now::before { animation: none; } }
  .result { margin-top: 14px; }
  .result .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .error { color: var(--danger); margin-top: 10px; }
  .how { counter-reset: how; display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
  .how li { position: relative; padding-left: 34px; }
  .how li::before { counter-increment: how; content: counter(how); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 50%; background: var(--ground); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .how small { display: block; color: var(--muted); }
  .labs { display: grid; gap: 8px; margin-top: 8px; }
  .labs a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); text-decoration: none; }
  .labs a:hover { border-color: var(--accent); }
  .labs span { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--ground); color: var(--muted); margin-left: 6px; }
  footer { color: var(--muted); font-size: 13px; padding: 24px 0 40px; }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><picture><source srcset="img/timalens-logo-dark.png" media="(prefers-color-scheme: dark)"><img src="img/timalens-logo.png" alt="TimaLens" width="168" height="28"></picture><span class="brand-lab">Lab</span></a>
  <div class="lesson-title"></div>
  <div id="lang-switch"></div>
  <a class="btn" id="sample-link" href="lab.html?lab=sample-lampes-fr" data-i18n="try_sample"></a>
</header>

<main class="wrap">
  <section class="hero">
    <h1 data-i18n="hero"></h1>
    <p data-i18n="hero_text"></p>
  </section>

  <div class="grid2">
    <section class="box" aria-labelledby="make">
      <h2 id="make" data-i18n="make"></h2>
      <form id="form">
        <label class="drop" id="drop">
          <b data-i18n="drop"></b>
          <span class="muted" data-i18n="drop_hint"></span>
          <input type="file" id="file" name="file" accept=".pdf,.docx,.pptx,.txt,.md,.jpg,.jpeg,.png,.webp,.mp3,.wav,.m4a,.ogg,.webm,.mp4,.mov" hidden>
          <div class="file" id="file-name"></div>
        </label>
        <div class="or" data-i18n="or_paste"></div>
        <textarea class="lesson" id="text" name="text" data-i18n-placeholder="paste_placeholder"></textarea>
        <div class="fields">
          <label><span data-i18n="language"></span>
            <select id="language" name="language">
              <option value="auto" data-i18n="same_as_lesson"></option>
              <option value="fr">Français</option>
              <option value="en">English</option>
              <optgroup data-label="other_languages">
                <option value="Wolof">Wolof</option>
                <option value="Hausa">Hausa</option>
                <option value="Yoruba">Yorùbá</option>
                <option value="Fon">Fɔngbè</option>
                <option value="Swahili">Kiswahili</option>
                <option value="Bambara">Bamanankan</option>
              </optgroup>
            </select>
          </label>
          <label><span data-i18n="level"></span>
            <input id="level" name="level" data-i18n-placeholder="level_placeholder">
          </label>
          <label class="wide"><span data-i18n="view"></span>
            <select id="view" name="view">
              <option value="auto" data-i18n="view_auto"></option>
              <option value="2d" data-i18n="view_2d"></option>
              <option value="3d" data-i18n="view_3d"></option>
            </select>
          </label>
        </div>
        <button class="btn primary go" id="go" type="submit" data-i18n="create"></button>
        <div class="error" id="error" role="alert"></div>
      </form>
      <ol class="stages" id="stages" hidden>
        <li data-stage="reading" data-i18n="stage_reading"></li>
        <li data-stage="designing" data-i18n="stage_designing"></li>
        <li data-stage="checking" data-i18n="stage_checking"></li>
        <li data-stage="ready" data-i18n="stage_ready"></li>
      </ol>
      <div class="muted" id="detail" style="margin-top:6px;font-size:13px"></div>
      <div class="result" id="result" hidden></div>
    </section>

    <aside class="box">
      <h2 data-i18n="how"></h2>
      <ol class="how">
        <li data-i18n="how1"></li>
        <li data-i18n="how2"></li>
        <li data-i18n="how3"></li>
        <li data-i18n="how4"></li>
        <li data-i18n="how5"></li>
      </ol>
      <h2 style="margin-top:20px" data-i18n="labs"></h2>
      <div class="labs" id="labs"><span class="muted">…</span></div>
    </aside>
  </div>

  <footer data-i18n="footer"></footer>
</main>

<script type="module">
import { TEACHER, mountLanguageSwitch, translatePage, uiLanguage } from "./js/i18n.js";
const $ = (s) => document.querySelector(s);
const lang = uiLanguage(), T = TEACHER[lang];
document.documentElement.lang = lang;
document.title = T.page_title;
translatePage(T);
for (const g of document.querySelectorAll("optgroup[data-label]")) g.label = T[g.dataset.label];
mountLanguageSwitch($("#lang-switch"), lang);
$("#sample-link").href = `lab.html?lab=sample-lampes-${lang}`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const ORDER = ["reading", "designing", "checking", "ready"];

const drop = $("#drop"), file = $("#file");
const showFile = () => { $("#file-name").textContent = file.files[0]?.name ?? ""; };
file.addEventListener("change", showFile);
for (const ev of ["dragenter", "dragover"]) drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); });
for (const ev of ["dragleave", "drop"]) drop.addEventListener(ev, () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer.files.length) { file.files = e.dataTransfer.files; showFile(); } });

function showStage(stage, detail = "") {
  $("#stages").hidden = false;
  const at = ORDER.indexOf(stage);
  for (const li of document.querySelectorAll("#stages li")) {
    const i = ORDER.indexOf(li.dataset.stage);
    li.className = i < at || stage === "ready" ? "done" : i === at ? "now" : "";
  }
  $("#detail").textContent = detail;
}

$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#error").textContent = ""; $("#result").hidden = true;
  if (!file.files[0] && $("#text").value.trim().length < 200) { $("#error").textContent = T.need_lesson; return; }
  const form = new FormData();
  if (file.files[0]) form.append("file", file.files[0]);
  form.append("text", $("#text").value);
  form.append("language", $("#language").value);
  form.append("level", $("#level").value);
  form.append("view", $("#view").value);
  $("#go").disabled = true;
  showStage("reading");
  try {
    const r = await fetch("/api/labs", { method: "POST", body: form });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail ?? T.server_error);
    await follow(body.job);
  } catch (err) {
    $("#error").textContent = err.message;
    $("#stages").hidden = true; $("#detail").textContent = "";
  } finally {
    $("#go").disabled = false;
  }
});

async function follow(job) {
  for (;;) {
    await new Promise((ok) => setTimeout(ok, 1200));
    const r = await fetch(`/api/jobs/${job}`);
    if (!r.ok) throw new Error(T.interrupted);
    const s = await r.json();
    if (s.stage === "unsupported") throw new Error(`${T.unsupported} ${s.detail}`);
    if (s.stage === "failed") throw new Error(`${T.failed} ${s.detail}`);
    showStage(s.stage, s.detail);
    if (s.stage === "ready") return ready(s.lab);
  }
}

function ready(id) {
  const url = new URL(`lab.html?lab=${id}`, location.href).href;
  const share = encodeURIComponent(`${T.share_text} ${url}`);
  $("#result").hidden = false;
  $("#result").innerHTML = `<div class="takeaway">${T.ready}<br><code style="word-break:break-all">${esc(url)}</code></div>
    <div class="row"><a class="btn primary" href="${esc(url)}">${T.open_lab}</a>
    <button class="btn" id="copy">${T.copy}</button>
    <a class="btn" href="https://wa.me/?text=${share}" target="_blank" rel="noopener">WhatsApp</a></div>`;
  $("#copy").onclick = async () => { try { await navigator.clipboard.writeText(url); $("#copy").textContent = T.copied; } catch { /* the link is shown */ } };
  loadLabs();
}

async function loadLabs() {
  try {
    const labs = await (await fetch(`/api/labs?lang=${lang}`)).json();
    $("#labs").innerHTML = labs.map((l) => `<a href="lab.html?lab=${encodeURIComponent(l.id)}">${esc(l.title)}<span>${l.origin === "sample" ? T.sample : T.generated}${l.view === "3d" ? " · 3D" : ""}</span></a>`).join("");
  } catch {
    $("#labs").innerHTML = `<a href="lab.html?lab=sample-lampes-${lang}">${lang === "fr" ? "Lampes en série et en dérivation" : "Bulbs in series and in parallel"}<span>${T.sample} · 3D</span></a>`;
  }
}
loadLabs();
</script>
</body>
</html>
