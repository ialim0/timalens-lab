<!doctype html>
<html lang="fr" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TimaLens Lab</title>
<link rel="icon" href="img/timalens-icon.png">
<link rel="stylesheet" href="css/lab.css">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }</script>
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><picture><source srcset="img/timalens-logo-dark.png" media="(prefers-color-scheme: dark)"><img src="img/timalens-logo.png" alt="TimaLens" width="168" height="28"></picture><span class="brand-lab">Lab</span></a>
  <div class="lesson-title" id="lab-title">…</div>
  <div class="origin" id="lab-origin"></div>
  <div id="lang-switch"></div>
  <div class="seg" role="group" id="view-switch"><button type="button" data-view="2d" aria-pressed="true">2D</button><button type="button" data-view="3d" aria-pressed="false">3D</button></div>
  <button type="button" class="btn primary" id="finish"></button>
</header>

<main class="layout">
  <section class="bench" aria-label="Circuit">
    <div class="toolbar" id="toolbar" role="toolbar"></div>
    <div class="canvas-wrap">
      <svg id="board" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Circuit"></svg>
      <canvas id="bench3d" hidden aria-label="Circuit 3D"></canvas>
      <div class="banner" id="banner" hidden></div>
      <div class="inspector" id="inspector" hidden></div>
    </div>
    <div class="bench-foot">
      <span class="hint" id="hint"></span>
      <label class="flow"><input type="checkbox" id="electrons"> <span id="electrons-label"></span></label>
    </div>
  </section>

  <aside class="panel">
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div class="tab-body" id="tab-body"></div>
  </aside>
</main>

<dialog id="finish-dialog" class="sheet"></dialog>

<script type="module" src="js/lab.js"></script>
</body>
</html>
