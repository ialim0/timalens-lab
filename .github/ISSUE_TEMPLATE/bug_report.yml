name: Bug report
description: Something in the lab, the tutor or the generation does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open /lab.html?lab=sample-ohm-en\n2. ..."
  - type: input
    id: env
    attributes:
      label: Browser / device / OS
      placeholder: "Chrome 130 on Android 12, low-end phone"
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Never paste your MODEL_API_KEY.
